name: Build Release Binaries (Windows & macOS M-Chip + Intel)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-and-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-AppleSilicon-M-Chip-arm64
            os: macos-14
            arch: arm64
            python: "3.11"
            asset_name: OpenStitch-Studio-macOS-AppleSilicon-M-Chip-arm64.zip
          - name: macOS-Intel-x64
            os: macos-15-intel
            arch: x64
            python: "3.11"
            asset_name: OpenStitch-Studio-macOS-Intel-x64.zip
          - name: Windows-SingleExe-x64
            os: windows-latest
            arch: x64
            python: "3.11"
            asset_name: OpenStitch-Studio-Windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
          cache: 'pip'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build macOS .app Bundle (Apple Silicon / Intel)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "OpenStitch Studio" \
            --exclude-module pytest --exclude-module tkinter --exclude-module matplotlib \
            main.py
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "OpenStitch Studio.app" "${{ matrix.asset_name }}"
        shell: bash

      - name: Build Windows Single-File .exe
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "OpenStitch-Studio-Windows-x64" --exclude-module pytest --exclude-module tkinter --exclude-module matplotlib main.py

      - name: Upload to GitHub Release v0.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            gh release upload v0.1.0 "dist/${{ matrix.asset_name }}" --clobber
          else
            gh release upload v0.1.0 "dist/OpenStitch-Studio-Windows-x64.exe" --clobber
          fi
        shell: bash
