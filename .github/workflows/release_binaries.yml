name: Build Release Binaries (Windows, macOS M-Chip + Intel, Linux)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the binaries to (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-and-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-AppleSilicon-M-Chip-arm64
            os: macos-14
            arch: arm64
            python: "3.11"
            asset_name: OpenStitch-Studio-macOS-AppleSilicon-M-Chip-arm64.zip
          - name: macOS-Intel-x64
            os: macos-15-intel
            arch: x64
            python: "3.11"
            asset_name: OpenStitch-Studio-macOS-Intel-x64.zip
          - name: Windows-SingleExe-x64
            os: windows-latest
            arch: x64
            python: "3.11"
            asset_name: OpenStitch-Studio-Windows-x64.exe
          - name: Linux-x64
            os: ubuntu-22.04
            arch: x64
            python: "3.11"
            asset_name: OpenStitch-Studio-Linux-x64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
          cache: 'pip'

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build macOS .app Bundle (Apple Silicon / Intel)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "OpenStitch Studio" \
            --exclude-module pytest --exclude-module tkinter --exclude-module matplotlib \
            main.py
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "OpenStitch Studio.app" "${{ matrix.asset_name }}"
        shell: bash

      - name: Build Windows Single-File .exe
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "OpenStitch-Studio-Windows-x64" --exclude-module pytest --exclude-module tkinter --exclude-module matplotlib main.py

      - name: Build Linux single file
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "OpenStitch-Studio" \
            --exclude-module pytest --exclude-module tkinter --exclude-module matplotlib \
            main.py
          tar -C dist -czf "dist/${{ matrix.asset_name }}" OpenStitch-Studio

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Ein reiner Tag-Push ohne vorbereitete Notizen darf den Build nicht scheitern lassen
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes || true
          if [ "${{ runner.os }}" != "Windows" ]; then
            gh release upload "$RELEASE_TAG" "dist/${{ matrix.asset_name }}" --clobber
          else
            gh release upload "$RELEASE_TAG" "dist/OpenStitch-Studio-Windows-x64.exe" --clobber
          fi
        shell: bash
