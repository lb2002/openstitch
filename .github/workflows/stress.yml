name: Stress tests

# Lange Zufallstests, zu langsam für jeden Push
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fuzz, damaged files and monkey test
        env:
          QT_QPA_PLATFORM: offscreen
          OPENSTITCH_FUZZ_RUNS: "400"
          OPENSTITCH_BADFILE_ROUNDS: "200"
          OPENSTITCH_MONKEY_STEPS: "1500"
          OPENSTITCH_MONKEY_SEEDS: "1,2,3,4,5,6"
        run: |
          pytest tests/test_fuzz.py tests/test_bad_files.py tests/test_monkey.py -v
