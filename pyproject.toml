[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openstitch"
version = "0.1.0"
description = "OpenStitch Studio — Universal Open-Source Embroidery & Digitizing Suite (DST, PES, EXP, JEF, VP3, U01)"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Linus Baumberger", email = "lbaumberger@student.ethz.ch"}
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "shapely>=2.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyembroidery>=1.5",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "fonttools>=4.40",
]

[project.urls]
Homepage = "https://github.com/lb2002/openstitch"
Repository = "https://github.com/lb2002/openstitch"
Issues = "https://github.com/lb2002/openstitch/issues"

[project.scripts]
openstitch = "openstitch.__main__:main"
